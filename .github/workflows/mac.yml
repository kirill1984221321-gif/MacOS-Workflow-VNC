name: Private macOS GUI via Tailscale AuthKey

on:
  workflow_dispatch:

jobs:
  macos-gui:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Шаг 1: Подключаемся к вашей сети Tailscale
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      # Шаг 2: Настраиваем SSH через sysadminctl (Вариант B)
      - name: Configure SSH Access
        run: |
          echo "=== Включаем SSH ==="
          sudo systemsetup -setremotelogin on

          echo "=== Сбрасываем пароль runner через sysadminctl ==="
          sudo sysadminctl -resetPasswordFor runner -newPassword RunnerPass123

          echo "=== Проверяем, что пользователь существует ==="
          id runner

          echo "=== SSH настроен. Логин: runner, Пароль: RunnerPass123 ==="

      # Шаг 3: Принудительно запускаем графическую сессию
      - name: Force GUI Session for VNC
        run: |
          echo "=== Отключаем блокировку экрана и сон ==="
          sudo defaults write /Library/Preferences/com.apple.screensaver askForPassword -int 0
          sudo defaults write /Library/Preferences/com.apple.screensaver askForPasswordDelay -int 0
          sudo pmset -a displaysleep 0 sleep 0 disablesleep 1

          echo "=== Включаем автологин для runner ==="
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser runner
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUserUID 501

          echo "=== VNC всегда стартует на консоли ==="
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCAlwaysStartOnConsole -bool true

          echo "=== Перезапускаем WindowServer (мягко) ==="
          sudo killall -HUP WindowServer || true
          sleep 15

          echo "=== caffeinate против засыпания дисплея ==="
          nohup /usr/bin/caffeinate -d -u -t 3600 >/dev/null 2>&1 &

      # Шаг 4: Настраиваем VNC (современный режим)
      - name: Configure VNC
        run: |
          echo "=== Настройка VNC ==="
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvncpw -vncpw MacOsPassword123 \
            -restart -agent -privs -all

          echo "=== Активация виртуального дисплея ==="
          sudo defaults write /Library/Preferences/com.apple.windowserver.plist DisplayResolutionEnabled -bool true
          sudo defaults write /Library/Preferences/com.apple.windowserver.plist DisplayResolutionAlwaysEnabled -bool true

      # Шаг 5: Диагностика — смотрим, кто владеет консолью
      - name: Diagnostics
        run: |
          echo "=== Кто владеет /dev/console ==="
          stat -f%Su /dev/console || true
          echo "=== Активные сессии ==="
          who || true
          echo "=== WindowServer ==="
          ps aux | grep -i windowserver | grep -v grep || true
          echo "=== Слушающие порты ==="
          sudo lsof -iTCP -sTCP:LISTEN -n -P | grep -E ':(22|5900)' || true

      # Шаг 6: Выводим данные и держим workflow открытым
      - name: Keep Alive and Display IP
        run: |
          IP=$(tailscale ip -4)
          echo "===================================================="
          echo "Виртуальная машина подключена к Tailscale!"
          echo "IP: $IP"
          echo "----------------------------------------------------"
          echo "SSH:  ssh runner@$IP"
          echo "Пароль SSH: RunnerPass123"
          echo "----------------------------------------------------"
          echo "VNC:  $IP:5900"
          echo "Пароль VNC: MacOsPassword123"
          echo "===================================================="

          sleep 19800
