name: Private macOS GUI via Tailscale AuthKey

on: 
  workflow_dispatch: # Позволяет запускать вручную кнопкой на GitHub

jobs:
  macos-gui:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Подключаемся к Tailscale с помощью вашего Auth Key
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      # 2. Настраиваем и включаем встроенный в macOS VNC (Screen Sharing)
      - name: Enable macOS Screen Sharing (VNC)
        run: |
          # Устанавливаем пароль для стандартного пользователя 'runner'
          sudo dscl . -passwd /Users/runner VncPassword123

          # Разрешаем запуск службы VNC на консоли общего экрана
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCAlwaysStartOnConsole -bool true
          
          # Активируем встроенный в macOS ARDAgent с поддержкой классического VNC
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw VncPassword123 \
            -restart -agent -privs -all

      # 3. Выводим IP-адрес и удерживаем виртуалку активной
      - name: Keep Alive and Display IP
        run: |
          echo "===================================================="
          echo "Виртуальная машина успешно подключена к Tailscale!"
          echo "Ваш IP в сети Tailscale:"
          tailscale ip -4
          echo "Логин для подключения к VNC: runner"
          echo "Пароль для подключения к VNC: VncPassword123"
          echo "===================================================="
          
          # Удерживаем сессию открытой (примерно 5.5 часов)
          sleep 19800
          
