name: Private macOS GUI via Tailscale AuthKey

on:
  workflow_dispatch:

jobs:
  macos-gui:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # Шаг 1: Подключаемся к сети Tailscale
      # ============================================================
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      # ============================================================
      # Шаг 2: SSH по ключу (ключ вшит прямо в workflow)
      # ============================================================
      - name: Configure SSH Access (Key Only)
        run: |
          echo "=== Включаем Remote Login (SSH) ==="
          sudo systemsetup -setremotelogin on || true

          echo "=== Кладём публичный ключ для runner ==="
          sudo mkdir -p /Users/runner/.ssh
          sudo tee /Users/runner/.ssh/authorized_keys > /dev/null <<'EOF'
          ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGlPfqVv+oWRt0HWLJrfZ5ngaVasLIkNvjhAAC+5b2wd u0_a1@localhost
          EOF
          sudo chmod 700 /Users/runner/.ssh
          sudo chmod 600 /Users/runner/.ssh/authorized_keys
          sudo chown -R runner:staff /Users/runner/.ssh

          echo "=== Проверяем содержимое ==="
          sudo cat /Users/runner/.ssh/authorized_keys

          echo "=== Проверяем отпечаток ==="
          sudo ssh-keygen -lf /Users/runner/.ssh/authorized_keys || true

          echo "=== SSH по ключу настроен ==="

      # ============================================================
      # Шаг 3: Настройка графической сессии
      # ============================================================
      - name: Force GUI Session for VNC
        run: |
          sudo defaults write /Library/Preferences/com.apple.screensaver askForPassword -int 0
          sudo defaults write /Library/Preferences/com.apple.screensaver askForPasswordDelay -int 0
          sudo pmset -a displaysleep 0 sleep 0 disablesleep 1 || true
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser runner
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUserUID 501
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCAlwaysStartOnConsole -bool true
          sudo defaults write /Library/Preferences/com.apple.windowserver.plist DisplayResolutionEnabled -bool true
          sudo defaults write /Library/Preferences/com.apple.windowserver.plist DisplayResolutionAlwaysEnabled -bool true
          nohup /usr/bin/caffeinate -d -u -t 3600 >/dev/null 2>&1 &

      # ============================================================
      # Шаг 4: Настройка VNC
      # ============================================================
      - name: Configure VNC
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvncpw -vncpw MacOsPassword123 \
            -restart -agent -privs -all || true
          sleep 3
          sudo lsof -iTCP:5900 -sTCP:LISTEN -n -P || echo "VNC пока не слушает"

      # ============================================================
      # Шаг 5: Диагностика
      # ============================================================
      - name: Diagnostics
        run: |
          echo "=== Кто владеет /dev/console ==="
          stat -f%Su /dev/console || true
          echo "=== Активные сессии ==="
          who || true
          echo "=== WindowServer ==="
          ps aux | grep -i windowserver | grep -v grep || true
          echo "=== Дисплеи ==="
          system_profiler SPDisplaysDataType || true
          echo "=== Порты 22 и 5900 ==="
          sudo lsof -iTCP -sTCP:LISTEN -n -P | grep -E ':(22|5900)' || true

      # ============================================================
      # Шаг 6: Данные для подключения и удержание
      # ============================================================
      - name: Keep Alive and Display IP
        run: |
          IP=$(tailscale ip -4)
          echo "===================================================="
          echo "IP: $IP"
          echo "SSH: ssh -i ~/.ssh/gh_runner -o StrictHostKeyChecking=no runner@$IP"
          echo "VNC: $IP:5900  пароль: MacOsPassword123"
          echo "===================================================="
          sleep 19800
