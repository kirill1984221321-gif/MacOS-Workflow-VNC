name: Private macOS GUI via Tailscale AuthKey

on: 
  workflow_dispatch: # Позволяет запускать вручную кнопкой на GitHub

jobs:
  macos-gui:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Подключаемся к Tailscale с помощью вашего Auth Key
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      # 2. Создаем нового пользователя и включаем VNC (Screen Sharing)
      - name: Create VNC User and Enable Screen Sharing
        run: |
          # 1. Создаем нового администратора 'vncuser' с паролем 'MacOsPassword123'
          # Это гарантирует, что у учетной записи точно будет рабочий и известный нам пароль
          sudo sysadminctl -addUser vncuser -fullName "VNC User" -password "MacOsPassword123" -admin

          # 2. Разрешаем запуск службы VNC на консоли общего экрана
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCAlwaysStartOnConsole -bool true
          
          # 3. Активируем встроенный в macOS ARDAgent с поддержкой классического VNC
          # Прописываем пароль 'MacOsPassword123' для самого VNC-протокола
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw MacOsPassword123 \
            -restart -agent -privs -all

      # 3. Выводим IP-адрес и удерживаем виртуалку активной
      - name: Keep Alive and Display IP
        run: |
          echo "===================================================="
          echo "Виртуальная машина успешно подключена к Tailscale!"
          echo "Ваш IP в сети Tailscale:"
          tailscale ip -4
          echo "----------------------------------------------------"
          echo "ДАННЫЕ ДЛЯ ПОДКЛЮЧЕНИЯ К VNC:"
          echo "Логин: vncuser"
          echo "Пароль: MacOsPassword123"
          echo "===================================================="
          
          # Удерживаем сессию открытой 5.5 часов
          sleep 19800
          
