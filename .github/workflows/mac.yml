name: Private macOS GUI via Tailscale AuthKey

on: 
  workflow_dispatch:

jobs:
  macos-gui:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Подключаемся к Tailscale
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      # 2. Настраиваем пользователя, автологин и графику
      - name: Configure macOS Desktop and VNC
        run: |
          # Создаем администратора 'vncuser'
          sudo sysadminctl -addUser vncuser -fullName "VNC User" -password "MacOsPassword123" -admin

          # Включаем автоматический вход в систему для vncuser, чтобы рабочий стол грузился сам
          sudo defaults write /Library/Preferences/com.apple.loginwindow AutoLoginUser -string "vncuser"
          
          # Генерируем хэш пароля для автологина (требование безопасности macOS)
          echo "MacOsPassword123" | sudo tee /etc/kcpassword > /dev/null

          # Отключаем заставку для текущего системного окружения
          defaults write com.apple.screensaver idleTime 0

          # Принудительно задаем виртуальное разрешение
          sudo defaults write /Library/Preferences/com.apple.windowserver.plist DisplayResolutionEnabled -bool true

          # Активируем службу удаленного управления VNC
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCAlwaysStartOnConsole -bool true
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw MacOsPassword123 \
            -restart -agent -privs -all

          # Перезапускаем графический интерфейс, чтобы применить автологин
          sudo killall WindowServer || true

      # 3. Удерживаем сессию активной
      - name: Keep Alive and Display IP
        run: |
          echo "===================================================="
          echo "Виртуальная машина успешно подключена к Tailscale!"
          echo "Ваш IP в сети Tailscale:"
          tailscale ip -4
          echo "----------------------------------------------------"
          echo "ДАННЫЕ ДЛЯ ПОДКЛЮЧЕНИЯ К VNC:"
          echo "Логин: vncuser"
          echo "Пароль: MacOsPassword123"
          echo "===================================================="
          
          sleep 19800
          
