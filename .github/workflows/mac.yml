name: Private macOS GUI via Tailscale AuthKey

on:
  workflow_dispatch:

jobs:
  macos-gui:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # Шаг 1: Быстрая установка и подключение Tailscale (без сборки)
      # ============================================================
      - name: Connect to Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          brew install tailscale
          sudo brew services start tailscale
          sleep 3
          sudo tailscale up --authkey="$TS_AUTHKEY" --accept-routes

      # ============================================================
      # Шаг 2: Создаём админа Kirill с паролем 2015 и настраиваем SSH
      # ============================================================
      - name: Create Admin User and Configure SSH
        run: |
          echo "=== Включаем Remote Login (SSH) ==="
          sudo systemsetup -setremotelogin on || true

          echo "=== Создаём пользователя Kirill с паролем 2015 через sysadminctl ==="
          sudo sysadminctl -addUser Kirill -fullName "Kirill" -password 2015 -admin

          echo "=== Кладём публичный ключ для runner и Kirill ==="
          for U in runner Kirill; do
            sudo mkdir -p /Users/$U/.ssh
            sudo tee /Users/$U/.ssh/authorized_keys > /dev/null <<'EOF'
          ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGlPfqVv+oWRt0HWLJrfZ5ngaVasLIkNvjhAAC+5b2wd u0_a1@localhost
          EOF
            sudo chmod 700 /Users/$U/.ssh
            sudo chmod 600 /Users/$U/.ssh/authorized_keys
            sudo chown -R $U:staff /Users/$U/.ssh
          done

      # ============================================================
      # Шаг 3: Настройка графической сессии (без дисплея и сна)
      # ============================================================
      - name: Force GUI Session for VNC
        run: |
          sudo defaults write /Library/Preferences/com.apple.screensaver askForPassword -int 0
          sudo defaults write /Library/Preferences/com.apple.screensaver askForPasswordDelay -int 0
          sudo pmset -a displaysleep 0 sleep 0 disablesleep 1 || true
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCAlwaysStartOnConsole -bool true
          sudo defaults write /Library/Preferences/com.apple.windowserver.plist DisplayResolutionEnabled -bool true
          sudo defaults write /Library/Preferences/com.apple.windowserver.plist DisplayResolutionAlwaysEnabled -bool true
          nohup /usr/bin/caffeinate -d -u -t 21600 >/dev/null 2>&1 &

      # ============================================================
      # Шаг 4: Включение Screen Sharing через System Settings (osascript) + VNC
      # ============================================================
      - name: Enable Screen Sharing via System Settings and Configure VNC
        run: |
          # 1. Записываем XOR-хеш пароля 2015 для legacy VNC-клиентов
          echo "2015" | perl -we 'BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA"}; $_ = <>; chomp; s/^(.{8}).*/$1/; @p = unpack "C*", $_; foreach (@k) { printf "%02X", $_ ^ (shift @p || 0) }; print "\n"' | sudo tee /Library/Preferences/com.apple.VNCSettings.txt > /dev/null

          # 2. Открываем раздел Общий доступ (Sharing) в Параметрах системы и включаем Screen Sharing
          open "x-apple.systempreferences:com.apple.Sharing-Settings.extension"
          sleep 4
          osascript <<'EOF' || true
          tell application "System Events"
            tell process "System Settings"
              repeat with cb in every checkbox of group 1 of scroll area 1 of group 1 of group 2 of splitter group 1 of group 1 of window 1
                if (name of cb contains "Screen Sharing") or (description of cb contains "Screen Sharing") then
                  if value of cb is 0 then click cb
                end if
              end repeat
            end tell
          end tell
          EOF
          sleep 2

          # 3. Задаём legacy-пароль VNC и права доступа
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw 2015 \
            -privs -all || true

          sudo launchctl kickstart -k system/com.apple.screensharing || true
          sleep 3
          sudo lsof -iTCP:5900 -sTCP:LISTEN -n -P || echo "VNC пока не слушает"

      # ============================================================
      # Шаг 5: Диагностика
      # ============================================================
      - name: Diagnostics
        run: |
          echo "=== Кто владеет /dev/console ==="
          stat -f%Su /dev/console || true
          echo "=== Дисплеи ==="
          system_profiler SPDisplaysDataType || true
          echo "=== Порты 22 и 5900 ==="
          sudo lsof -iTCP -sTCP:LISTEN -n -P | grep -E ':(22|5900)' || true

      # ============================================================
      # Шаг 6: Данные для подключения и удержание (6 часов)
      # ============================================================
      - name: Keep Alive and Display IP
        run: |
          IP=$(tailscale ip -4)
          echo "===================================================="
          echo "IP: $IP"
          echo "SSH: ssh -i ~/.ssh/gh_runner -o StrictHostKeyChecking=no Kirill@$IP"
          echo "VNC: $IP:5900  логин: Kirill  пароль: 2015"
          echo "===================================================="
          sleep 21500
